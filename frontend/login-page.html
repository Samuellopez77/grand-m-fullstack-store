<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up</title>
  <link rel="stylesheet" href="styles/login.css">
</head>

<body>
  <div class="signup-container">
    <form id="signup-form">
      <h2>LOGIN</h2>
      <h4>please enter credentials</h4>

      <input type="text" id="username" class="user" placeholder="Username" required>

      <div class="pass-container">
        <input type="password" id="passcode" placeholder="Password" required>
        <span id="toggle-passcode" class="toggle-passcode">&#128065;</span>
      </div>
      </form>
        <button  class="login-btn" type="submit">Login</button>
        <p class="forgot-passcode"><a href="#">Forgot Password?</a></p>
        <p class="signup"><a href="signup-page.html">Don't have an account?</
      </div>
      </body>
      </html>
